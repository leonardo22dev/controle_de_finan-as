# Publica a pasta pwa/ no GitHub Pages a cada push na main.
#
# Necessário porque o modo "Deploy from a branch" do Pages só serve a raiz do
# repositório ou /docs — e a PWA vive em /pwa, ao lado do backend Python.
#
# Ative uma vez em: Settings -> Pages -> Source: GitHub Actions

name: Publicar PWA

on:
  push:
    branches: [main]
  workflow_dispatch:        # permite disparar manualmente pela aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Se dois pushes acontecerem juntos, só o mais recente publica.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Versões conferidas na API da GitHub em 12/08/2026. As anteriores
      # (checkout@v4, configure-pages@v5, upload-pages-artifact@v3,
      # deploy-pages@v4) rodavam em Node 20, que foi aposentado — daí o aviso
      # de obsolescência nas execuções.
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - name: Empacotar a pasta pwa/
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./pwa

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v5
